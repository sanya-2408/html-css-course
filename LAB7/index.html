<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>З Новим роком!</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<ul>
  <li><a href="../index.html">Головна</a></li>
</ul>
<body class="page">
  <div class="page__container">

    <div class="card">
      <div class="card__content">
        <h1 class="card__title">З Новим <span class="card__year">2027</span> роком!</h1>
        <p class="card__text">
          Бажаю щастя, здоров'я, гарного настрою та успіхів у навчанні.
          Нехай новий рік буде кращим за попередній!
        </p>
        <p class="card__author">Олександр Мимоход</p>
      </div>

      <div class="tree">
        <div class="tree__star">★</div>
        <div class="tree__part"></div>
        <div class="tree__part tree__part--big"></div>
        <div class="tree__trunk"></div>
      </div>
    </div>

    <div class="wishes">
      <h2 class="wishes__title">Мої побажання</h2>
      <ul class="wishes__list">
        <li class="wishes__item">Багато подарунків 🎁</li>
        <li class="wishes__item wishes__item--gold">Закрити сесію без боргів 📚</li>
        <li class="wishes__item wishes__item--green">Миру та спокою 🕊️</li>
      </ul>
    </div>

    <div class="footer">Мимоход О. Д., ТЦР-22, 2026</div>

  </div>
</body>
</html>
