<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Практична робота 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Клавіатура</h1>
<ul>
    <li><a href="../index.html">Головна</a></li>
</ul>
<div class="keyboard">

    <div class="func">
        <button class="key"><span>Esc</span></button>
        <div class="space2"></div>
        <button class="key"><span>F1</span></button>
        <button class="key"><span>F2</span></button>
        <button class="key"><span>F3</span></button>
        <button class="key"><span>F4</span></button>
        <div class="space1"></div>
        <button class="key"><span>F5</span></button>
        <button class="key"><span>F6</span></button>
        <button class="key"><span>F7</span></button>
        <button class="key"><span>F8</span></button>
        <div class="space1"></div>
        <button class="key"><span>F9</span></button>
        <button class="key"><span>F10</span></button>
        <button class="key"><span>F11</span></button>
        <button class="key"><span>F12</span></button>
    </div>

    <div class="top">
        <button class="key"><span>Stamp</span><span>R Sist</span></button>
        <button class="key"><span>Bloc</span><span>Scorr</span></button>
        <button class="key"><span>Pausa</span><span>Interr</span></button>

    <div class="lights">
        <div class="light">1<div class="lamp on"></div></div>
        <div class="light">A<div class="lamp"></div></div>
        <div class="light">↓<div class="lamp"></div></div>
    </div>

    <div class="main">
        <button class="key"><span>|</span><span>\</span></button>
        <button class="key"><span>!</span><span>1</span></button>
        <button class="key"><span>"</span><span>2</span></button>

        <button class="key"><span>$</span><span>4</span></button>
        <button class="key"><span>%</span><span>5</span></button>
        <button class="key"><span>&amp;</span><span>6</span></button>
        <button class="key"><span>/</span><span>7</span></button>
        <button class="key"><span>(</span><span>8</span></button>
        <button class="key"><span>)</span><span>9</span></button>
        <button class="key"><span>=</span><span>0</span></button>
        <button class="key"><span>?</span><span>'</span></button>
        <button class="key"><span>^</span><span>ì</span></button>
        <button class="key w4"><span>←</span></button>

        <button class="key w3"><span>⇤</span><span>⇥</span></button>

        <button class="key"><span>W</span></button>
        <button class="key"><span>E</span><span>€</span></button>
        <button class="key"><span>R</span></button>
        <button class="key"><span>T</span></button>
        <button class="key"><span>Y</span></button>
        <button class="key"><span>U</span></button>
        <button class="key"><span>I</span></button>
        <button class="key"><span>O</span></button>
        <button class="key"><span>P</span></button>
        <button class="key"><span>é</span><span>è [</span></button>
        <button class="key"><span>*</span><span>+ ]</span></button>
        <button class="key w3 enter"><span>↵ Invio</span></button>

        <button class="key w3"><span>Caps</span><span>Lock</span></button>
        <button class="key"><span>A</span></button>
        <button class="key"><span>S</span></button>
        <button class="key"><span>D</span></button>
        <button class="key"><span>F</span></button>
        <button class="key"><span>G</span></button>
        <button class="key"><span>H</span></button>

        <button class="key"><span>K</span></button>
        <button class="key"><span>L</span></button>
        <button class="key"><span>ç</span><span>ò @</span></button>
        <button class="key"><span>°</span><span>à #</span></button>
        <button class="key"><span>§</span><span>ù</span></button>

        <button class="key w3"><span>⇧</span></button>
        <button class="key"><span>&gt;</span><span>&lt;</span></button>
        <button class="key"><span>Z</span></button>
        <button class="key"><span>X</span></button>
        <button class="key"><span>C</span></button>
        <button class="key"><span>V</span></button>
        <button class="key"><span>B</span></button>
        <button class="key"><span>N</span></button>

        <button class="key w3"><span>Ctrl</span></button>

        <button class="key"><span>Ins</span></button>
        <button class="key"><span>↖</span></button>
        <button class="key"><span>Pag↑</span></button>

        <button class="key"><span>Canc</span></button>
        <button class="key"><span>Fine</span></button>
        <button class="key"><span>Pag↓</span></button>

        <button class="key up"><span>↑</span></button>

        <button class="key left"><span>←</span></button>
        <button class="key down"><span>↓</span></button>
        <button class="key right"><span>→</span></button>
    </div>

    <div class="numpad">
        <button class="key"><span>Bloc</span><span>Num</span></button>
        <button class="key"><span>/</span></button>
        <button class="key"><span>*</span></button>
        <button class="key"><span>-</span></button>

        <button class="key"><span>7</span><span>↖</span></button>
        <button class="key"><span>8</span><span>↑</span></button>
        <button class="key"><span>9</span><span>Pag↑</span></button>

        <button class="key"><span>4</span><span>←</span></button>
        <button class="key"><span>5</span></button>
        <button class="key"><span>6</span><span>→</span></button>

        <button class="key"><span>1</span><span>Fine</span></button>
        <button class="key"><span>2</span><span>↓</span></button>
        <button class="key"><span>3</span><span>Pag↓</span></button>
        <button class="key tall"><span>Invio</span></button>

        <button class="key zero"><span>0</span><span>Ins</span></button>
        <button class="key"><span>.</span><span>Canc</span></button>

</div>
