
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Weekly Plan</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<nav>
    <ul>
        <li><a href="../index.html">Головна</a></li>
    </ul>
</nav>
<div class="planner">

    <header>
        <h1>WEEKLY PLAN</h1>

        <label class="week">
            WEEK OF <input type="text">
        </label>

        <label class="habit">
            HEALTHY HABIT <input type="text">
        </label>

        <div class="header-right">
            <label>ROCKED IT <input type="checkbox"></label>
            <label>ROOM FOR IMPROVEMENT <input type="checkbox"></label>
        </div>
    </header>

    <main class="grid">

        <aside class="sidebar">
            <h3>TO DO</h3>

            <section>
                <h4>TOP 3 GOALS</h4>
                <div class="tasks">
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                </div>
            </section>

            <section>
                <h4>EVERYTHING ELSE</h4>
                <div class="tasks">
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                </div>
            </section>

            <section>
                <h4>NEXT WEEK</h4>
                <div class="tasks">
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                    <label><input type="checkbox"><input type="text"></label>
                </div>
            </section>
        </aside>

        <div class="day monday">
            <h3>MONDAY <input type="checkbox"></h3>
            <textarea></textarea>
        </div>

        <div class="day tuesday">
            <h3>TUESDAY <input type="checkbox"></h3>
            <textarea></textarea>
        </div>

        <div class="day wednesday">
            <h3>WEDNESDAY <input type="checkbox"></h3>
            <textarea></textarea>
        </div>

        <div class="day thursday">
            <h3>THURSDAY <input type="checkbox"></h3>
            <textarea></textarea>
        </div>

        <div class="day friday">
            <h3>FRIDAY <input type="checkbox"></h3>
            <textarea></textarea>
        </div>

        <div class="weekend">
            <div class="day saturday">
                <h3>SATURDAY <input type="checkbox"></h3>
                <textarea></textarea>
            </div>

            <div class="day sunday">
                <h3>SUNDAY <input type="checkbox"></h3>
                <textarea></textarea>
            </div>
        </div>

    </main>

    <footer></footer>

</div>

</body>
</html>
